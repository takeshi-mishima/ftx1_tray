; FTX-1 tray tool settings
; This file is rewritten when OK is pressed in the settings dialog.

[rigctld]
host = 127.0.0.1
port = 4534
; seconds
timeout = 6.0

[functions]
; <BUTTON> <OPE>
;   BUTTON : L / C / R / -  (- = unassigned)
;   OPE    : SGL / DBL / TPL / CTL (Ctrl+click)
SWAP = C SGL
VFO = - SGL
M145 = R SGL
M433 = R DBL
S145 = L SGL
S433 = L DBL
